validator.shaclFile.v1.1.0.range.remote.1.type = text/turtle
validator.shaclFile.v1.1.0.full.remote.0.url = https://mobilitydcat-ap.github.io/mobilityDCAT-AP/releases/1.1.0/shaclShapes/mobilitydcat-ap_1.1.0_shacl_shapes.ttl
validator.shaclFile.v1.1.0.full.remote.0.type = text/turtle
validator.shaclFile.v1.1.0.full.remote.1.url = https://mobilitydcat-ap.github.io/mobilityDCAT-AP/releases/1.1.0/shaclShapes/mobilitydcat-ap_1.1.0_shacl_range.ttl
validator.shaclFile.v1.1.0.full.remote.1.type = text/turtle
validator.shaclFile.v1.1.0.full.remote.2.url = https://mobilitydcat-ap.github.io/mobilityDCAT-AP/releases/1.1.0/shaclShapes/mobilitydcat-ap_1.1.0_shacl_mdr-vocabularies.shape.ttl
validator.shaclFile.v1.1.0.full.remote.2.type = text/turtle
validator.shaclFile.v1.1.0.cv.remote.0.url = https://mobilitydcat-ap.github.io/mobilityDCAT-AP/releases/1.1.0/shaclShapes/mobilitydcat-ap_1.1.0_shacl_mdr-vocabularies.shape.ttl
