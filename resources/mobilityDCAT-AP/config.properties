# The title to display for the validator's user interface.
validator.uploadTitle = mobilityDCAT-AP Validator

# Enable all validation channels
validator.channels = form,rest_api,soap_api

# Users can select if loadImports should be applied. Default is set to false and is applied if no choice is made.
validator.loadImports = false
validator.input.loadImports = optional

# Custom banner with logo and description
validator.bannerHtml = <div style="border-bottom:2px solid #0052CC;background-color:#f8f9fa;padding:20px"><div style="display:table;width:100%"><div style="display:table-row"><div style="display:table-cell;vertical-align:middle;padding-right:20px"><img src="https://mobilitydcat-ap.github.io/respec-style/logos/mobilityDCAT-AP-V3-logo.png" alt="mobilityDCAT-AP Logo" style="height:100px;max-width:280px"></div><div style="display:table-cell;vertical-align:middle"><div><h2 style="margin:0;color:#0052CC;font-size:28px;font-weight:bold">mobilityDCAT-AP SHACL Validator</h2><p style="margin:5px 0 0 0;color:#666;font-size:14px">Validate RDF metadata against the mobilityDCAT-AP specification using SHACL constraints</p></div></div></div></div><div style="margin-top:15px;padding-top:15px;border-top:1px solid #ddd"><p style="margin:0;font-size:13px;color:#666"><strong>About this validator:</strong> This service validates RDF content against SHACL shapes defined for the <a href="https://mobilitydcat-ap.github.io/mobilityDCAT-AP/" target="_blank" style="color:#0052CC;text-decoration:none">mobilityDCAT-AP specification</a>. Select one of the supported specification versions. For more information, see the <a href="https://www.itb.ec.europa.eu/docs/guides/latest/validatingRDF/" target="_blank" style="color:#0052CC;text-decoration:none">SHACL validator documentation</a>. Questions and feedback can be sent to the <a href="https://github.com/mobilitydcat-ap/mobilityDCAT-AP/issues" target="_blank" style="color:#0052CC;text-decoration:none">mobilityDCAT-AP project</a>.</p></div></div>

# Custom footer
validator.footerHtml = <div style="border-top:1px solid #ddd;margin-top:20px;padding-top:15px;text-align:center;font-size:12px;color:#999"><p style="margin:0">mobilityDCAT-AP SHACL Validator | Powered by the <a href="https://www.itb.ec.europa.eu" target="_blank" style="color:#0052CC;text-decoration:none">European Commission DIGIT Interoperability Test Bed</a></p><p style="margin:5px 0 0 0">© 2026 mobilityDCAT-AP | <a href="https://mobilitydcat-ap.github.io/mobilityDCAT-AP/" target="_blank" style="color:#0052CC;text-decoration:none">View Specification</a> | <a href="https://github.com/mobilitydcat-ap" target="_blank" style="color:#0052CC;text-decoration:none">GitHub</a></p></div>

# JavaScript extension for interactive elements
validator.javascriptExtension = $(document).ready(function() { $(".validatorReload").off().on("click", function() { window.location.href="upload"; }); });

# Sort content syntax
validator.contentSyntaxSorted = false
validator.contentSyntax = text/turtle,application/ld+json,application/rdf+xml,application/n-triples

# The different types of validation to support. These values are reflected in other properties.
validator.type = v1.0.0, v1.0.1, v1.1.0, v3.0.0
# Labels to describe the defined types.
validator.typeLabel.v1.0.0 = mobilityDCAT-AP version 1.0.0
validator.typeLabel.v1.0.1 = mobilityDCAT-AP version 1.0.1
validator.typeLabel.v1.1.0 = mobilityDCAT-AP version 1.1.0
validator.typeLabel.v3.0.0 = mobilityDCAT-AP version 3.0.0
# Options for each type
validator.typeOptions.v1.1.0 = core, range, full
validator.typeOptions.v3.0.0 = core, range, full, cv
validator.optionLabel.core = Core Constraints
validator.optionLabel.range = Range and Core Constraints
validator.optionLabel.full = Controlled Vocabularies, Range and Core Constraints
validator.optionLabel.cv = Controlled Vocabularies

# User can upload additional SHACL shapes to validate against. This is optional.
validator.externalShapes.v1.0.0 = optional
validator.externalShapes.v1.0.1 = optional
validator.externalShapes.v1.1.0 = optional
validator.externalShapes.v3.0.0 = optional

# Remote SHACL file definition.
# v1.0.0 configuration
validator.shaclFile.v1.0.0.remote.0.url = https://mobilitydcat-ap.github.io/mobilityDCAT-AP/releases/1.0.0/mobilitydcat-ap_shacl_shapes.ttl
validator.shaclFile.v1.0.0.remote.0.type = text/turtle
# v1.0.1 configuration
validator.shaclFile.v1.0.1.remote.0.url = https://mobilitydcat-ap.github.io/mobilityDCAT-AP/releases/1.0.1/mobilitydcat-ap_shacl_shapes.ttl
validator.shaclFile.v1.0.1.remote.0.type = text/turtle
# v1.1.0 configuration
validator.shaclFile.v1.1.0.core.remote.0.url = https://mobilitydcat-ap.github.io/mobilityDCAT-AP/releases/1.1.0/shaclShapes/mobilitydcat-ap_1.1.0_shacl_shapes.ttl
validator.shaclFile.v1.1.0.core.remote.0.type = text/turtle
